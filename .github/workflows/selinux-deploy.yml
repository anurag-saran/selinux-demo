name: SELinux Policy Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy action
        required: true
        type: choice
        options:
          - canary
          - enforce
          - rollback
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      policy_dir:
        description: Policy source directory (relative to repo root)
        required: false
        default: selinux
      change_ticket:
        description: Change ticket (required for enforce)
        required: false
        default: ""
      force_enforce:
        description: Break-glass skip soak (still requires change_ticket)
        required: false
        type: boolean
        default: false
      host_limit:
        description: Ansible --limit (blank = auto canary/production on prod)
        required: false
        default: ""

# Requires a self-hosted runner on a SELinux host:
#   staging:    runs-on: [self-hosted, selinux-staging]
#   production: runs-on: [self-hosted, selinux-production]
#
# Configure GitHub Environments "staging" and "production" with required reviewers
# for production enforce/rollback actions.

jobs:
  deploy:
    name: "${{ inputs.action }} (${{ inputs.environment }})"
    runs-on: ${{ inputs.environment == 'production' && fromJSON('["self-hosted", "selinux-production"]') || fromJSON('["self-hosted", "selinux-staging"]') }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Validate policy directory
        run: |
          test -f "${{ inputs.policy_dir }}/myapp.te"
          test -f "${{ inputs.policy_dir }}/myapp.fc"

      - name: Compile policy module
        run: bash scripts/compile_and_validate.sh "${{ inputs.policy_dir }}"

      - name: Select Ansible inventory
        id: inv
        run: |
          inv="ansible/inventory.${{ inputs.environment }}.yml"
          if [[ ! -f "${inv}" ]]; then
            echo "Missing ${inv} — copy from ansible/inventory.${{ inputs.environment }}.example.yml" >&2
            exit 1
          fi
          echo "path=${inv}" >> "$GITHUB_OUTPUT"

      - name: Resolve Ansible host limit
        id: limit
        run: |
          host_limit="${{ inputs.host_limit }}"
          if [[ -z "${host_limit}" && "${{ inputs.environment }}" == "production" ]]; then
            if [[ "${{ inputs.action }}" == "canary" ]]; then
              host_limit="canary"
            elif [[ "${{ inputs.action }}" == "enforce" ]]; then
              host_limit="production"
            fi
          fi
          echo "value=${host_limit}" >> "$GITHUB_OUTPUT"

      - name: Run canary deploy
        if: inputs.action == 'canary'
        id: canary
        run: |
          set -o pipefail
          args=(-i "${{ steps.inv.outputs.path }}" ansible/deploy_canary.yml \
            -e "policy_pp_src=${{ github.workspace }}/${{ inputs.policy_dir }}/myapp.pp" \
            -e "policy_artifact_dir=${{ github.workspace }}" \
            -e "selinux_ops_from_package=false" \
            -e "selinux_ops_dir=${{ github.workspace }}/scripts" \
            -e "app_manifest_path=${{ github.workspace }}/config/myapp.manifest.yml")
          if [[ -n "${{ steps.limit.outputs.value }}" ]]; then
            args+=(--limit "${{ steps.limit.outputs.value }}")
          fi
          ansible-playbook "${args[@]}" 2>&1 | tee /tmp/ansible-deploy.log

      - name: Run enforce production
        if: inputs.action == 'enforce'
        id: enforce
        run: |
          set -o pipefail
          args=(-i "${{ steps.inv.outputs.path }}" ansible/enforce_production.yml \
            -e "policy_artifact_dir=${{ github.workspace }}" \
            -e "selinux_ops_from_package=false" \
            -e "selinux_ops_dir=${{ github.workspace }}/scripts" \
            -e "app_manifest_path=${{ github.workspace }}/config/myapp.manifest.yml" \
            -e "change_ticket=${{ inputs.change_ticket }}" \
            -e "force_enforce=${{ inputs.force_enforce }}")
          if [[ -n "${{ steps.limit.outputs.value }}" ]]; then
            args+=(--limit "${{ steps.limit.outputs.value }}")
          fi
          ansible-playbook "${args[@]}" 2>&1 | tee /tmp/ansible-deploy.log

      - name: Run emergency rollback
        if: inputs.action == 'rollback'
        id: rollback
        run: |
          set -o pipefail
          args=(-i "${{ steps.inv.outputs.path }}" ansible/emergency_rollback.yml)
          if [[ -n "${{ steps.limit.outputs.value }}" ]]; then
            args+=(--limit "${{ steps.limit.outputs.value }}")
          fi
          ansible-playbook "${args[@]}" 2>&1 | tee /tmp/ansible-deploy.log

      - name: Upload Ansible log artifact
        if: always() && hashFiles('/tmp/ansible-deploy.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ansible-deploy-${{ inputs.action }}-${{ inputs.environment }}-log
          path: /tmp/ansible-deploy.log

      - name: Notify webhook on failure
        if: failure()
        env:
          INCIDENT_WEBHOOK_URL: ${{ secrets.INCIDENT_WEBHOOK_URL }}
        run: |
          [[ -n "${INCIDENT_WEBHOOK_URL}" ]] || exit 0
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"SELinux deploy FAILED: action=${{ inputs.action }} env=${{ inputs.environment }} repo=${{ github.repository }} run=${{ github.run_id }}\"}" \
            "${INCIDENT_WEBHOOK_URL}" || true

      - name: Notify webhook on success
        if: success()
        env:
          INCIDENT_WEBHOOK_URL: ${{ secrets.INCIDENT_WEBHOOK_URL }}
        run: |
          [[ -n "${INCIDENT_WEBHOOK_URL}" ]] || exit 0
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"SELinux deploy PASSED: action=${{ inputs.action }} env=${{ inputs.environment }} report=/var/lib/myapp/selinux_deploy_report.json\"}" \
            "${INCIDENT_WEBHOOK_URL}" || true

      - name: Enforce job summary
        if: inputs.action == 'enforce'
        run: |
          {
            echo "## Production enforce"
            echo ""
            echo "- Host limit: \`${{ steps.limit.outputs.value || 'all inventory hosts' }}\`"
            echo "- Change ticket: \`${{ inputs.change_ticket }}\`"
            echo "- Soak gate: \`collect_soak_facts.sh\` / \`soak_status.yml\` (7+ days, zero **net-new** access needs by default)"
            echo "- force_enforce: \`${{ inputs.force_enforce }}\` (break-glass only; ticket still required)"
            echo "- Deploy report: \`/var/lib/myapp/selinux_deploy_report.json\`"
            echo "- Runbook: [docs/admin/PRODUCTION_READINESS.md](docs/admin/PRODUCTION_READINESS.md)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy failure summary
        if: failure()
        run: |
          {
            echo "## Deploy failed"
            echo ""
            echo "- Action: \`${{ inputs.action }}\`"
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Check uploaded Ansible log artifact"
            echo "- App team card: docs/admin/PRODUCTION_READINESS.md (App team incident card)"
          } >> "${GITHUB_STEP_SUMMARY}"
