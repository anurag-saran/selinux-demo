name: SELinux Policy CI

on:
  pull_request:
    paths:
      - 'selinux/**'
      - 'cli/**'
      - 'scripts/**'
      - 'config/**'
      - 'packaging/**'
      - 'ansible/**'
      - 'Makefile'
      - '.github/workflows/selinux-policy-ci.yml'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'packaging/**'
  push:
    branches:
      - main
      - master
    paths:
      - 'selinux/**'
      - 'cli/**'
      - 'scripts/**'
      - 'config/**'
      - 'packaging/**'
      - 'ansible/**'
      - 'Makefile'

jobs:
  smoke:
    name: smoke-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CLI dependencies
        run: make deps

      - name: Run smoke tests
        run: make test-smoke

  app-manifest:
    name: app-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install manifest dependencies
        run: make deps

      - name: Validate app manifests
        run: make test-manifest

  rpm-ops-parity:
    name: rpm-ops-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate selinux-policy-ops packaging allowlist
        run: make test-rpm

  forbidden-patterns:
    name: forbidden-patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate forbidden SELinux patterns
        run: make test-forbidden

  version-consistency:
    name: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify policy version single source of truth
        run: make test-version

  deterministic-fixtures:
    name: deterministic-fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CLI dependencies
        run: make deps

      - name: Run deterministic golden fixtures
        run: bash scripts/run_deterministic_fixtures.sh

      - name: Deterministic generator (payments manifest, no myapp leak)
        run: bash scripts/run_deterministic_payments_check.sh

  blast-radius:
    name: blast-radius
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@v4

      - name: Install SELinux policy tools
        run: bash scripts/ci/install_rhel_policy_tools.sh

      - name: Run blast-radius fixture suite
        env:
          BLAST_RADIUS_REQUIRE_INTEGRATION: "1"
        run: make integration-blast-radius

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          make lint-shell

  policy-diff-comment:
    name: policy-diff-comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for merge-base diff
        run: git fetch origin main:refs/remotes/origin/main || git fetch origin master:refs/remotes/origin/master

      - name: Install SELinux policy tools
        run: bash scripts/ci/install_rhel_policy_tools.sh

      - name: Install GitHub CLI
        run: |
          dnf -y install curl tar gzip
          ver=2.62.0
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz" | tar -xz -C /tmp
          install "/tmp/gh_${ver}_linux_amd64/bin/gh" /usr/local/bin/gh

      - name: Post policy access delta comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/post_pr_policy_diff_comment.sh

  policy-access-delta:
    name: policy-access-delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for merge-base diff
        run: git fetch origin main:refs/remotes/origin/main || git fetch origin master:refs/remotes/origin/master

      - name: Install SELinux policy tools
        run: bash scripts/ci/install_rhel_policy_tools.sh

      - name: Verify merge-base policy access delta renders
        run: |
          out="$(mktemp)"
          bash scripts/lib/policy_module_diff.sh \
            --app-name myapp \
            --from-merge-base \
            --cand-dir selinux \
            --output "${out}" \
            --format markdown
          grep -q 'Policy access delta' "${out}"
          rm -f "${out}"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run yamllint
        run: |
          pip install yamllint
          make lint-yaml

  compile:
    name: compile-policy
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@v4

      - name: Install SELinux policy tools
        run: bash scripts/ci/install_rhel_policy_tools.sh

      - name: Compile selinux/ module
        run: |
          bash scripts/compile_and_validate.sh selinux
          POLICY_MODULE=payments SELINUX_DOMAIN=payments_t bash scripts/compile_and_validate.sh selinux/payments

      - name: Upload compiled policy package
        uses: actions/upload-artifact@v4
        with:
          name: selinux-myapp-pp
          path: selinux/myapp.pp
          if-no-files-found: error

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Lint Ansible playbooks
        run: make lint-ansible

  policy-semantics:
    name: policy-semantics
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@v4

      - name: Install SELinux policy tools
        run: bash scripts/ci/install_rhel_policy_tools.sh

      - name: Run sesearch semantic assertions
        run: bash scripts/validate_policy_semantics.sh selinux
