name: SELinux Policy CI

on:
  pull_request:
    paths:
      - 'selinux/**'
      - 'cli/**'
      - 'scripts/**'
      - 'config/**'
      - 'packaging/**'
      - 'ansible/**'
      - '.github/workflows/selinux-policy-ci.yml'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'packaging/**'
  push:
    branches:
      - main
      - master
    paths:
      - 'selinux/**'
      - 'cli/**'
      - 'scripts/**'
      - 'config/**'
      - 'packaging/**'
      - 'ansible/**'

jobs:
  smoke:
    name: smoke-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CLI dependencies
        run: pip install -r cli/requirements.txt

      - name: Run smoke tests
        run: python3 scripts/smoke_test.py

  app-manifest:
    name: app-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install manifest dependencies
        run: pip install pyyaml

      - name: Validate demo app manifest
        run: bash scripts/validate_app_manifest.sh config/myapp.manifest.yml

      - name: Validate onboarding example manifest
        run: bash scripts/validate_app_manifest.sh config/payments.manifest.example.yml

  rpm-ops-parity:
    name: rpm-ops-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate selinux-policy-ops packaging allowlist
        run: bash scripts/validate_rpm_ops_parity.sh

  forbidden-patterns:
    name: forbidden-patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate forbidden SELinux patterns
        run: bash scripts/validate_forbidden_patterns.sh selinux

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh scripts/lib/*.sh

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run yamllint
        run: |
          pip install yamllint
          yamllint -d relaxed ansible/ .github/workflows/

  compile:
    name: compile-policy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Compile selinux/ module
        env:
          SELINUX_COMPILE_IMAGE: ${{ matrix.image }}
        run: bash scripts/compile_and_validate.sh selinux

      - name: Upload compiled policy package
        uses: actions/upload-artifact@v4
        with:
          name: selinux-myapp-pp-${{ matrix.image }}
          path: selinux/myapp.pp
          if-no-files-found: error

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Lint Ansible playbooks
        run: ansible-lint ansible/*.yml

  policy-semantics:
    name: policy-semantics
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Compile policy for semantic checks
        env:
          SELINUX_COMPILE_IMAGE: quay.io/centos/centos:stream9
        run: bash scripts/compile_and_validate.sh selinux

      - name: Run sesearch semantic assertions
        env:
          SELINUX_COMPILE_IMAGE: quay.io/centos/centos:stream9
        run: bash scripts/validate_policy_semantics.sh selinux
