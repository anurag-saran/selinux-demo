name: SELinux Policy CI

on:
  pull_request:
    paths:
      - 'selinux/**'
      - 'cli/**'
      - 'scripts/**'
      - 'config/**'
      - 'packaging/**'
      - 'ansible/**'
      - '.github/workflows/selinux-policy-ci.yml'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'packaging/**'
  push:
    branches:
      - main
      - master
    paths:
      - 'selinux/**'
      - 'cli/**'
      - 'scripts/**'
      - 'config/**'
      - 'packaging/**'
      - 'ansible/**'

jobs:
  smoke:
    name: smoke-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CLI dependencies
        run: pip install -r cli/requirements.txt

      - name: Run smoke tests
        run: python3 scripts/smoke_test.py

  app-manifest:
    name: app-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install manifest dependencies
        run: pip install pyyaml

      - name: Validate demo app manifest
        run: bash scripts/validate_app_manifest.sh config/myapp.manifest.yml

      - name: Validate onboarding example manifest
        run: bash scripts/validate_app_manifest.sh config/payments.manifest.example.yml

  rpm-ops-parity:
    name: rpm-ops-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate selinux-policy-ops packaging allowlist
        run: bash scripts/validate_rpm_ops_parity.sh

  forbidden-patterns:
    name: forbidden-patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate forbidden SELinux patterns
        run: bash scripts/validate_forbidden_patterns.sh selinux

  version-consistency:
    name: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify policy version single source of truth
        run: bash scripts/validate_version_consistency.sh

  blast-radius:
    name: blast-radius
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Ensure SELinux compile image (pull-first, else build)
        run: bash scripts/lib/selinux_build_image.sh ensure

      - name: Run blast-radius fixture suite
        run: bash scripts/run_blast_radius_fixtures.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh scripts/lib/*.sh scripts/ci/*.sh scripts/validate_version_consistency.sh

  policy-diff-comment:
    name: policy-diff-comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for merge-base diff
        run: git fetch origin main:refs/remotes/origin/main || git fetch origin master:refs/remotes/origin/master

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Post policy access delta comment
        env:
          GH_TOKEN: ${{ github.token }}
          SELINUX_COMPILE_IMAGE: quay.io/centos/centos:stream9
        run: bash scripts/ci/post_pr_policy_diff_comment.sh

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run yamllint
        run: |
          pip install yamllint
          yamllint -d relaxed ansible/ .github/workflows/

  compile:
    name: compile-policy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Ensure SELinux compile image
        run: bash scripts/lib/selinux_build_image.sh ensure

      - name: Compile selinux/ module
        run: bash scripts/compile_and_validate.sh selinux

      - name: Upload compiled policy package
        uses: actions/upload-artifact@v4
        with:
          name: selinux-myapp-pp-${{ matrix.image }}
          path: selinux/myapp.pp
          if-no-files-found: error

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Lint Ansible playbooks
        run: ansible-lint ansible/*.yml

  policy-semantics:
    name: policy-semantics
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Compile policy for semantic checks
        env:
          SELINUX_COMPILE_IMAGE: quay.io/centos/centos:stream9
        run: bash scripts/compile_and_validate.sh selinux

      - name: Run sesearch semantic assertions
        env:
          SELINUX_COMPILE_IMAGE: quay.io/centos/centos:stream9
        run: bash scripts/validate_policy_semantics.sh selinux
