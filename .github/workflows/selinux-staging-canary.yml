name: SELinux Staging Canary

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'selinux/**'
      - 'ansible/**'
      - 'scripts/wait_for_endpoints.sh'
      - 'scripts/post_deploy_report.sh'

jobs:
  staging-canary:
    name: staging-canary
    runs-on: [self-hosted, selinux-staging]
    environment: staging
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Compile policy from selinux/
        run: bash scripts/compile_and_validate.sh selinux

      - name: Deploy canary (permissive domain)
        run: |
          INV="ansible/inventory.staging.yml"
          if [[ ! -f "${INV}" ]]; then
            INV="ansible/inventory.example.yml"
          fi
          ansible-playbook -i "${INV}" ansible/deploy_canary.yml \
            -e "policy_pp_src=${{ github.workspace }}/selinux/myapp.pp" \
            -e "policy_artifact_dir=${{ github.workspace }}" \
            -e "selinux_ops_from_package=false" \
            -e "selinux_ops_dir=${{ github.workspace }}/scripts" \
            -e "app_manifest_path=${{ github.workspace }}/config/myapp.manifest.yml"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Staging canary deploy"
            echo ""
            echo "- Policy dir: \`selinux/\`"
            echo "- Trigger: merge to \`${{ github.ref_name }}\`"
            echo "- Deploy report: \`/var/lib/myapp/selinux_deploy_report.json\`"
            echo "- Next: admin runs **SELinux Policy Deploy** → \`enforce\` on \`production\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  staging-endpoint-smoke:
    name: staging-endpoint-smoke
    needs: staging-canary
    runs-on: [self-hosted, selinux-staging]
    environment: staging
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify all endpoints after canary
        run: bash scripts/wait_for_endpoints.sh --host 127.0.0.1 --retries 10 --delay 2

      - name: Show deploy report
        run: |
          if [[ -f /var/lib/myapp/selinux_deploy_report.json ]]; then
            cat /var/lib/myapp/selinux_deploy_report.json
          else
            echo "Deploy report not found at /var/lib/myapp/selinux_deploy_report.json" >&2
            exit 1
          fi

      - name: Endpoint smoke summary
        if: always()
        run: |
          {
            echo "## Staging endpoint smoke"
            echo ""
            echo "- Unified check: \`scripts/wait_for_endpoints.sh\` (6 HTTP endpoints + backend)"
            echo "- Report: \`/var/lib/myapp/selinux_deploy_report.json\`"
          } >> "${GITHUB_STEP_SUMMARY}"
