apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: selinux-pac-policy-compile
spec:
  params:
    - name: policy-dir
      type: string
      default: selinux
    - name: compile-image
      type: string
      default: docker.io/asaran/selinux-demo-selinux-build:stream9
  workspaces:
    - name: source
      description: Repository checkout
  steps:
    - name: compile
      image: $(params.compile-image)
      workingDir: $(workspaces.source.path)
      workspaces:
        - name: source
          workspace: source
      script: |
        #!/bin/bash
        set -euo pipefail
        bash scripts/compile_and_validate.sh "$(params.policy-dir)"
