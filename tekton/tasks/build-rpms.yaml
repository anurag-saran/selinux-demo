apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: selinux-pac-build-rpms
spec:
  workspaces:
    - name: source
      description: Repository checkout
  steps:
    - name: build
      image: quay.io/centos/centos:stream9
      workingDir: $(workspaces.source.path)
      workspaces:
        - name: source
          workspace: source
      script: |
        #!/bin/bash
        set -euo pipefail
        bash scripts/compile_and_validate.sh selinux
        bash packaging/build_rpms.sh || true
