---
# Target-side ops scripts (RPM or checkout override via inventory).
selinux_ops_dir: /usr/libexec/selinux-policy-ops
selinux_ops_from_package: true

# Application manifest on target (shipped in myapp-selinux RPM).
app_manifest_path: /etc/myapp/selinux-manifest.yml

# Controller-side policy artifacts (never referenced in remote command paths).
policy_artifact_dir: "{{ playbook_dir }}/.."
policy_pp_src: "{{ policy_artifact_dir }}/selinux/{{ app_name | default('myapp') }}.pp"
policy_staging_path: /var/lib/selinux-policy-staging/{{ app_name | default('myapp') }}.pp

# policy_version is loaded from selinux/policy_version.txt in tasks/main.yml (not duplicated here).
myapp_selinux_package: "myapp-selinux-{{ policy_version }}"

# Rollback via dnf (e.g. 1.1.1-1); empty skips downgrade.
rollback_dnf_version: ""

# FCOS overlay when semanage absent — compiled myapp_canary.pp under repo selinux/.
selinux_repo_dir: >-
  {{
    (policy_artifact_dir | dirname) ~ '/selinux'
    if (policy_artifact_dir | basename) == 'policy_out'
    else policy_artifact_dir ~ '/selinux'
  }}
stub_policy_src: "{{ selinux_repo_dir }}/myapp_canary.pp"
stub_policy_staging: /var/lib/selinux-policy-staging/myapp_canary.pp
ports_cil_src: "{{ selinux_repo_dir }}/myapp_ports.cil"
ports_cil_staging: /var/lib/selinux-policy-staging/myapp_ports.cil

myapp_selinux_phase: canary
