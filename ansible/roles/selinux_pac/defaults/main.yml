---
# Target-side ops scripts (RPM or checkout override via inventory).
selinux_ops_dir: /usr/libexec/selinux-policy-ops
selinux_ops_from_package: true

# Application manifest on target (shipped in <app>-selinux RPM).
app_manifest_path: /etc/myapp/selinux-manifest.yml

# Controller-side policy artifacts (never referenced in remote command paths).
policy_artifact_dir: "{{ playbook_dir }}/.."
# Empty on production (RPM-only). Dev inventory sets a controller checkout path.
policy_pp_src: ""
policy_staging_path: /var/lib/selinux-policy-staging/{{ app_name | default('myapp') }}.pp

# policy_version is loaded from selinux/policy_version.txt in tasks/main.yml (not duplicated here).
selinux_pac_package: "{{ app_name | default('myapp') }}-selinux-{{ policy_version }}"

# Rollback via dnf (e.g. 1.1.1-1); empty skips downgrade.
rollback_dnf_version: ""

# FCOS overlay when semanage absent — compiled <app>_canary.pp under policy module dir.
selinux_repo_dir: >-
  {{
    (policy_artifact_dir | dirname) ~ '/selinux'
    if (policy_artifact_dir | basename) == 'policy_out'
    else policy_artifact_dir ~ '/selinux'
  }}
stub_policy_src: "{{ selinux_repo_dir }}/{{ app_name | default('myapp') }}_canary.pp"
stub_policy_staging: /var/lib/selinux-policy-staging/{{ app_name | default('myapp') }}_canary.pp
ports_cil_src: "{{ selinux_repo_dir }}/{{ app_name | default('myapp') }}_ports.cil"
ports_cil_staging: /var/lib/selinux-policy-staging/{{ app_name | default('myapp') }}_ports.cil"

selinux_pac_phase: canary

# Lab only: install demo systemd units from repo app/ directory.
selinux_pac_install_demo_units: false

# Soak gates (enforce + soak_monitor playbook).
soak_min_days: 7
soak_max_avc: 0
soak_use_net_new: true
soak_max_net_new: 0
soak_notify_webhook: ""
http_probe_host: "127.0.0.1"

# Enforce / AAP survey. force_enforce never skips the change_ticket check.
force_enforce: false
change_ticket: ""
