---
- name: Run soak AVC monitor
  ansible.builtin.shell: |
    set -o pipefail
    {{ selinux_ops_dir }}/monitor_avc.sh \
      --manifest {{ app_manifest_path }} \
      --marker-file {{ soak_marker_file }} \
      --max-avc {{ soak_max_avc | default(0) }} \
      --max-net-new {{ soak_max_net_new | default(0) }} \
      --show-lines {{ soak_show_lines | default(5) }} \
      --fail-dir {{ var_dir }} \
      --format json \
      {{ ('--notify-webhook ' ~ (soak_notify_webhook | quote)) if (soak_notify_webhook | default('') | length) > 0 else '' }}
  register: soak_monitor_json
  changed_when: false
  failed_when: soak_monitor_json.rc not in [0, 1]

- name: Parse soak monitor result
  ansible.builtin.set_fact:
    soak_monitor: "{{ soak_monitor_json.stdout | from_json }}"

- name: Fail when soak monitor reports failure
  ansible.builtin.fail:
    msg: >-
      Soak monitor failed: raw={{ soak_monitor.count }} net_new={{ soak_monitor.net_new_count }}
      (max_avc={{ soak_max_avc | default(0) }} max_net_new={{ soak_max_net_new | default(0) }}).
      {{ soak_monitor.next_step | default('Copy ' ~ var_dir ~ '/selinux_soak_last_fail.json to rhel-dev, run dev_generate_policy.sh, open a PR. Do not semodule -i.') }}
  when: soak_monitor.status == 'fail'

- name: Fail when sesearch was unavailable (raw AVC fallback is not allowed)
  ansible.builtin.fail:
    msg: >-
      Soak monitor fail-closed (sesearch missing or net-new analysis failed).
      {{ soak_monitor.fail_closed_reason | default('Install setools-console on canary/prod — it is required by selinux-policy-ops.') }}
  when:
    - soak_use_net_new | default(true) | bool
    - soak_monitor.avc_fail_closed | default(false) | bool
    - (soak_monitor.count | default(0) | int) > 0

- name: Soak monitor summary
  ansible.builtin.debug:
    msg: >-
      Soak OK for {{ app_name }}: raw AVC={{ soak_monitor.count }},
      net_new={{ soak_monitor.net_new_count }},
      fail_closed={{ soak_monitor.avc_fail_closed }}.
