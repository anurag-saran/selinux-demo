---
- name: Load application manifest from target
  ansible.builtin.import_tasks: load_manifest.yml

- name: Stat policy_version.txt in policy artifact dir (policy_out layout)
  ansible.builtin.stat:
    path: "{{ policy_artifact_dir }}/policy_version.txt"
  register: pac_pv_artifact
  run_once: true
  delegate_to: localhost
  become: false
  when: selinux_pac_phase not in ['soak_monitor', 'soak_status', 'rollback', 'reset_host']

- name: Stat policy_version in manifest module_dir
  ansible.builtin.stat:
    path: "{{ policy_artifact_dir }}/{{ pac_manifest.policy.module_dir | default('selinux') }}/policy_version.txt"
  register: pac_pv_module
  run_once: true
  delegate_to: localhost
  become: false
  when:
    - selinux_pac_phase not in ['soak_monitor', 'soak_status']
    - not pac_pv_artifact.stat.exists

- name: Stat selinux/policy_version.txt next to artifact dir (repo checkout)
  ansible.builtin.stat:
    path: "{{ policy_artifact_dir }}/../selinux/policy_version.txt"
  register: pac_pv_selinux
  run_once: true
  delegate_to: localhost
  become: false
  when:
    - selinux_pac_phase not in ['soak_monitor', 'soak_status']
    - not pac_pv_artifact.stat.exists
    - not (pac_pv_module.stat.exists | default(false))

- name: Fail when policy version file is missing
  ansible.builtin.fail:
    msg: >-
      No policy_version.txt under {{ policy_artifact_dir }}
      or module_dir — run dev_generate_policy or stage_skip_ai_fixture
  when:
    - selinux_pac_phase not in ['soak_monitor', 'soak_status']
    - not pac_pv_artifact.stat.exists
    - not (pac_pv_selinux.stat.exists | default(false))
    - not (pac_pv_module.stat.exists | default(false))
  run_once: true

- name: Load policy version
  ansible.builtin.set_fact:
    policy_version: >-
      {{
        lookup(
          'file',
          (policy_artifact_dir ~ '/policy_version.txt')
          if pac_pv_artifact.stat.exists
          else (
            (policy_artifact_dir ~ '/' ~ pac_manifest.policy.module_dir ~ '/policy_version.txt')
            if (pac_pv_module.stat.exists | default(false))
            else (policy_artifact_dir ~ '/../selinux/policy_version.txt')
          )
        ) | trim
      }}
  run_once: true
  when: selinux_pac_phase not in ['soak_monitor', 'soak_status', 'rollback', 'reset_host']

- name: Require sesearch for canary / soak / enforce
  ansible.builtin.import_tasks: require_sesearch.yml
  when: selinux_pac_phase in ['canary', 'soak_monitor', 'soak_status', 'enforce']

- name: Run selinux_pac role phase
  ansible.builtin.import_tasks: "{{ selinux_pac_phase }}.yml"
