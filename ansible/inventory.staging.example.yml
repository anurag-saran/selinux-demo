# Copy to ansible/inventory.staging.yml on your staging SELinux host.
# Do not commit secrets — use GitHub Environment secrets or Ansible Vault.

all:
  hosts:
    staging-host:
      ansible_connection: local
      ansible_become: true
  vars:
    app_name: myapp
    domain: myapp_t
    install_root: /opt/myapp
    var_dir: /var/myapp
    service_name: myapp.service
    policy_pp_path: "{{ playbook_dir }}/../selinux/myapp.pp"
    project_root: "{{ playbook_dir }}/.."
    ansible_env_path: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    soak_marker_file: "{{ var_dir }}/selinux_canary_deployed_at"
    soak_min_days: 7
    soak_max_avc: 0
