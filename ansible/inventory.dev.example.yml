# QA RHEL box (policy discovery). Filename inventory.dev.yml is legacy.
# Copy to ansible/inventory.dev.yml (gitignored) or generate with:
#   bash scripts/setup_rhel_hosts.sh write --qa-host HOST --prod-host HOST
#
# Run Ansible from a controller (laptop or AAP). The demo app is installed
# on the host with: sudo bash scripts/setup_staging_env.sh
#
# Controller-only: policy_artifact_dir, policy_pp_src (compiled .pp on this machine).
# On rhel-qa (clone path): selinux_ops_dir, app_manifest_path.
# playbook_dir is the laptop/AAP path — do not use it for those two.

all:
  hosts:
    rhel-qa:
      ansible_host: rhel-qa.example.com
      ansible_user: ansible
      ansible_become: true
      ansible_python_interpreter: /usr/bin/python3
  vars:
    app_name: myapp
    domain: myapp_t
    install_root: /opt/myapp
    var_dir: /var/lib/myapp
    log_dir: /var/log/myapp
    runtime_dir: /run/myapp
    service_name: myapp.service
    selinux_ops_from_package: false
    selinux_ops_dir: /home/ansible/selinux-pac/scripts
    policy_artifact_dir: "{{ playbook_dir }}/.."
    policy_pp_src: "{{ policy_artifact_dir }}/selinux/{{ app_name }}.pp"
    app_manifest_path: /home/ansible/selinux-pac/config/myapp.manifest.yml
    ansible_env_path: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    soak_marker_file: "{{ var_dir }}/selinux_canary_deployed_at"
    soak_min_days: 0
    soak_max_avc: 0
    soak_max_net_new: 0
    soak_use_net_new: true
    selinux_pac_install_demo_units: false
    http_probe_host: "127.0.0.1"
