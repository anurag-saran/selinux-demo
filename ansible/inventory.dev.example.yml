# Dev RHEL box (staging / policy discovery).
# Copy to ansible/inventory.dev.yml (gitignored) or generate with:
#   bash scripts/setup_rhel_hosts.sh write --dev-host HOST --prod-host HOST
#
# Run Ansible from a controller (laptop or the dev box). The demo app is
# installed on the host with: sudo bash scripts/setup_staging_env.sh

all:
  hosts:
    rhel-dev:
      ansible_host: rhel-dev.example.com
      ansible_user: ansible
      ansible_become: true
  vars:
    app_name: myapp
    domain: myapp_t
    install_root: /opt/myapp
    var_dir: /var/lib/myapp
    log_dir: /var/log/myapp
    runtime_dir: /run/myapp
    service_name: myapp.service
    selinux_ops_from_package: false
    selinux_ops_dir: "{{ playbook_dir }}/../scripts"
    policy_artifact_dir: "{{ playbook_dir }}/.."
    policy_pp_src: "{{ policy_artifact_dir }}/selinux/{{ app_name }}.pp"
    app_manifest_path: "{{ policy_artifact_dir }}/config/{{ app_name }}.manifest.yml"
    ansible_env_path: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    soak_marker_file: "{{ var_dir }}/selinux_canary_deployed_at"
    soak_min_days: 0
    soak_max_avc: 0
    soak_max_net_new: 0
    soak_use_net_new: true
    selinux_pac_install_demo_units: false
    http_probe_host: "127.0.0.1"
