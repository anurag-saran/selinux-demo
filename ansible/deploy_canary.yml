---
- name: Canary deploy — permissive domain + policy install
  hosts: all
  become: true
  collections:
    - community.general
    - ansible.posix
  environment:
    PATH: "{{ ansible_env_path | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
  vars:
    bin_dir: "{{ install_root }}/bin"
    notify_sock: "{{ (runtime_dir | default('/run/myapp')) }}/notify.sock"
    policy_history_dir: "{{ var_dir }}/policy-history"
    stub_policy_dir: "{{ project_root }}/selinux/stub"

  tasks:
    - name: Detect semanage availability
      ansible.builtin.stat:
        path: /usr/sbin/semanage
      register: semanage_bin

    - name: Ensure policy package exists
      ansible.builtin.stat:
        path: "{{ policy_pp_path }}"
      register: pp_stat

    - name: Fail if policy package missing
      ansible.builtin.fail:
        msg: "Build policy first: bash scripts/compile_and_validate.sh selinux"
      when: not pp_stat.stat.exists

    - name: Ensure policy history directory exists
      ansible.builtin.file:
        path: "{{ policy_history_dir }}"
        state: directory
        mode: "0750"

    - name: Read policy version for history archive name
      ansible.builtin.slurp:
        src: "{{ project_root }}/selinux/policy_version.txt"
      register: policy_version_slurp

    - name: Archive policy package for versioned rollback
      ansible.builtin.copy:
        src: "{{ policy_pp_path }}"
        dest: >-
          {{ policy_history_dir }}/{{ app_name }}-{{ (policy_version_slurp.content | b64decode | trim) }}.pp
        mode: "0644"
      when: pp_stat.stat.exists

    - block:
        - name: Install policy module package (in-place upgrade)
          ansible.builtin.command: "semodule -i {{ policy_pp_path }}"
          changed_when: true

        - name: Disable dontaudit rules during canary soak
          ansible.builtin.command: semodule -DB
          changed_when: true

        - name: Register application TCP port 8888
          community.general.seport:
            ports: "8888"
            proto: tcp
            setype: "{{ app_name }}_port_t"
            state: present
          when: semanage_bin.stat.exists

        - name: Register backend TCP port 8889
          community.general.seport:
            ports: "8889"
            proto: tcp
            setype: "{{ app_name }}_backend_port_t"
            state: present
          when: semanage_bin.stat.exists

        - name: Note FCOS permissive limitation
          ansible.builtin.debug:
            msg: "semanage unavailable — domain stays enforcing unless policy declares permissive {{ domain }}"
          when: not semanage_bin.stat.exists

        - name: Enable permissive domain for canary
          community.general.selinux_permissive:
            name: "{{ domain }}"
            permissive: true
          when: semanage_bin.stat.exists

        - name: Install permissive overlay for FCOS canary (no semanage)
          ansible.builtin.command: "semodule -i {{ project_root }}/selinux/myapp_canary.pp"
          changed_when: true
          when: not semanage_bin.stat.exists

        - name: Ensure persistent application directories exist
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: "{{ app_run_user | default('myapp') }}"
            group: "{{ app_run_group | default('myapp') }}"
            mode: "{{ item.mode }}"
          loop:
            - { path: "{{ var_dir }}", mode: "0750" }
            - { path: "{{ log_dir | default('/var/log/myapp') }}", mode: "0750" }

        - name: Restore file contexts on persistent application paths
          ansible.builtin.command: >-
            restorecon -Rv {{ install_root }} {{ var_dir }}
            {{ log_dir | default('/var/log/myapp') }}
          changed_when: true

        - name: Verify file contexts before service restart
          ansible.builtin.command: >
            bash {{ project_root }}/scripts/verify_file_contexts.sh
            --install-root {{ install_root }}
            --var-dir {{ var_dir }}
            --log-dir {{ log_dir }}
            --app-name {{ app_name }}
          changed_when: false

        - name: Record canary deploy timestamp for soak gate
          ansible.builtin.shell: "date +%s > {{ soak_marker_file | default(var_dir + '/selinux_canary_deployed_at') }}"
          changed_when: true

        - name: Restart application services via systemd
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: restarted
            enabled: true
          loop:
            - myapp-backend.service
            - "{{ service_name }}"

        - name: Restore file contexts on runtime directory after service start
          ansible.builtin.command: "restorecon -Rv {{ runtime_dir | default('/run/myapp') }}"
          changed_when: true

        - name: Wait for all endpoints (unified canary smoke)
          ansible.builtin.command: >
            bash {{ project_root }}/scripts/wait_for_endpoints.sh
            --manifest {{ app_manifest_path }}
            --host 127.0.0.1 --retries 15 --delay 2
          changed_when: false

        - name: Check for new domain AVC/SELINUX_ERR events (10-minute post-deploy window)
          ansible.builtin.shell: |
            set -o pipefail
            bash {{ project_root }}/scripts/monitor_avc.sh \
              --domain {{ domain }} \
              --since recent \
              --max-avc -1 \
              --show-lines 0 \
              --format json
          register: avc_json
          changed_when: false

        - name: Parse canary AVC count
          ansible.builtin.set_fact:
            avc_count: "{{ (avc_json.stdout | from_json).count | default(0) }}"

        - name: Fail when canary AVC count exceeds threshold
          ansible.builtin.fail:
            msg: >-
              Canary AVC count {{ avc_count }} exceeds threshold
              {{ canary_max_avc | default(0) }}. Review AVCs before enforce.
          when: avc_count | int > (canary_max_avc | default(0) | int)

        - name: Write canary deploy report
          ansible.builtin.command: >
            bash {{ project_root }}/scripts/post_deploy_report.sh
            --phase canary
            --domain {{ domain }}
            --var-dir {{ var_dir }}
            --manifest {{ app_manifest_path }}
            --marker-file {{ soak_marker_file | default(var_dir + '/selinux_canary_deployed_at') }}
            --project-root {{ project_root }}
          register: deploy_report
          changed_when: true
          failed_when: deploy_report.rc != 0

        - name: Report canary status
          ansible.builtin.debug:
            msg: >-
              Recent {{ domain }} events: {{ avc_count }} (threshold {{ canary_max_avc | default(0) }}).
              Deploy report: {{ var_dir }}/selinux_deploy_report.json.
              Soak marker: {{ soak_marker_file | default(var_dir + '/selinux_canary_deployed_at') }}.

      rescue:
        - name: Restore dontaudit baseline after failed canary
          ansible.builtin.command: semodule -B
          changed_when: true

        - name: Canary deploy failed
          ansible.builtin.fail:
            msg: >-
              Canary deploy failed; semodule -B restored dontaudit baseline.
              Inspect AVCs and {{ var_dir }}/selinux_deploy_report.json if present.
