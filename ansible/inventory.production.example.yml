# Prod RHEL box (canary → soak → enforce).
# Copy to ansible/inventory.production.yml (gitignored) or generate with:
#   bash scripts/setup_rhel_hosts.sh write --dev-host HOST --prod-host HOST
#
# One host is both the canary group and the production group. Add more names
# under production: when you grow a fleet.
#
# Production targets: no git clone. Install selinux-policy-ops + <app>-selinux RPMs.

all:
  children:
    canary:
      hosts:
        rhel-prod:
    production:
      hosts:
        rhel-prod:
  hosts:
    rhel-prod:
      ansible_host: rhel-prod.example.com
      ansible_user: ansible
      ansible_become: true
  vars:
    app_name: myapp
    domain: myapp_t
    install_root: /opt/myapp
    var_dir: /var/lib/myapp
    log_dir: /var/log/myapp
    runtime_dir: /run/myapp
    service_name: myapp.service
    selinux_ops_from_package: true
    selinux_ops_dir: /usr/libexec/selinux-policy-ops
    app_manifest_path: /etc/myapp/selinux-manifest.yml
    policy_artifact_dir: "{{ playbook_dir }}/.."
    policy_pp_src: ""
    ansible_env_path: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    soak_marker_file: "{{ var_dir }}/selinux_canary_deployed_at"
    soak_min_days: 7
    soak_max_avc: 0
    soak_max_net_new: 0
    soak_use_net_new: true
    rollback_dnf_version: ""
    http_probe_host: "127.0.0.1"
