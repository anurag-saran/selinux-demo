---
- name: Enforce production — remove permissive domain
  hosts: all
  become: true
  serial: 1
  collections:
    - community.general
    - ansible.posix
  environment:
    PATH: "{{ ansible_env_path | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"

  vars:
    bin_dir: "{{ install_root }}/bin"
    notify_sock: "{{ (runtime_dir | default('/run/myapp')) }}/notify.sock"
    policy_history_dir: "{{ var_dir }}/policy-history"

  tasks:
    - name: Check soak period and AVC gate before enforce
      ansible.builtin.command: >
        bash {{ project_root }}/scripts/check_soak_ready.sh
        --domain {{ domain }}
        --manifest {{ app_manifest_path }}
        --marker-file {{ soak_marker_file | default(var_dir + '/selinux_canary_deployed_at') }}
        --report-file {{ var_dir }}/selinux_deploy_report.json
        --min-days {{ soak_min_days | default(7) }}
        --max-avc {{ soak_max_avc | default(0) }}
      when: not (force_enforce | default(false) | bool)
      changed_when: false

    - name: Break-glass enforce override active
      ansible.builtin.debug:
        msg: "force_enforce=true — skipping soak gate (document approval in change ticket)"
      when: force_enforce | default(false) | bool

    - name: Re-enable dontaudit baseline before enforce
      ansible.builtin.command: semodule -B
      changed_when: true

    - name: Detect semanage availability
      ansible.builtin.stat:
        path: /usr/sbin/semanage
      register: semanage_bin

    - name: Enforce production domain (with auto-rescue on failure)
      block:
        - name: Remove permissive flag from domain
          community.general.selinux_permissive:
            name: "{{ domain }}"
            permissive: false
          when: semanage_bin.stat.exists

        - name: Remove FCOS permissive overlay before enforce
          ansible.builtin.command: semodule -r myapp_canary
          register: overlay_remove
          failed_when: overlay_remove.rc not in [0, 1]
          changed_when: overlay_remove.rc == 0
          when: not semanage_bin.stat.exists

        - name: Verify SELinux enforcing mode
          ansible.builtin.command: getenforce
          register: selinux_mode
          changed_when: false
          failed_when: selinux_mode.stdout != "Enforcing"

        - name: Verify domain not permissive
          ansible.builtin.shell: |
            semanage permissive -l 2>/dev/null | grep -w {{ domain }} && exit 1 || exit 0
          changed_when: false
          when: semanage_bin.stat.exists

        - name: Ensure persistent application directories exist
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: "{{ app_run_user | default('myapp') }}"
            group: "{{ app_run_group | default('myapp') }}"
            mode: "{{ item.mode }}"
          loop:
            - { path: "{{ var_dir }}", mode: "0750" }
            - { path: "{{ log_dir | default('/var/log/myapp') }}", mode: "0750" }

        - name: Restore file contexts on persistent application paths
          ansible.builtin.command: >-
            restorecon -Rv {{ install_root }} {{ var_dir }}
            {{ log_dir | default('/var/log/myapp') }}
          changed_when: true

        - name: Verify file contexts before service restart
          ansible.builtin.command: >
            bash {{ project_root }}/scripts/verify_file_contexts.sh
            --install-root {{ install_root }}
            --var-dir {{ var_dir }}
            --log-dir {{ log_dir }}
            --app-name {{ app_name }}
          changed_when: false

        - name: Restart services under enforcing policy via systemd
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: restarted
          loop:
            - myapp-backend.service
            - "{{ service_name }}"

        - name: Restore file contexts on runtime directory after service start
          ansible.builtin.command: "restorecon -Rv {{ runtime_dir | default('/run/myapp') }}"
          changed_when: true

        - name: Production smoke tests (unified endpoint wait)
          ansible.builtin.command: >
            bash {{ project_root }}/scripts/wait_for_endpoints.sh
            --manifest {{ app_manifest_path }}
            --host 127.0.0.1 --retries 15 --delay 2
          changed_when: false

        - name: Write enforce deploy report
          ansible.builtin.command: >
            bash {{ project_root }}/scripts/post_deploy_report.sh
            --phase enforce
            --domain {{ domain }}
            --var-dir {{ var_dir }}
            --manifest {{ app_manifest_path }}
            --marker-file {{ soak_marker_file | default(var_dir + '/selinux_canary_deployed_at') }}
            --project-root {{ project_root }}
          register: deploy_report
          changed_when: true
          failed_when: deploy_report.rc != 0

      rescue:
        - name: Auto-rescue — restore permissive domain after enforce failure
          community.general.selinux_permissive:
            name: "{{ domain }}"
            permissive: true
          when: semanage_bin.stat.exists

        - name: Auto-rescue — restart services after enforce failure
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: restarted
          loop:
            - myapp-backend.service
            - "{{ service_name }}"

        - name: Auto-rescue — verify endpoints after rollback to permissive
          ansible.builtin.command: >
            bash {{ project_root }}/scripts/wait_for_endpoints.sh
            --manifest {{ app_manifest_path }}
            --host 127.0.0.1 --retries 10 --delay 2
          changed_when: false

        - name: Enforce failed — domain reverted to permissive
          ansible.builtin.fail:
            msg: >-
              Enforce failed on {{ inventory_hostname }}; {{ domain }} restored to permissive.
              Inspect AVCs and deploy report at {{ var_dir }}/selinux_deploy_report.json.
